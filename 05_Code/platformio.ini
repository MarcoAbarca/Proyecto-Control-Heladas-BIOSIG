; =============================================================================
; platformio.ini - Sistema de Monitoreo Modular ESP32-S3 + LoRa P2P + TTN
; -----------------------------------------------------------------------------
; Dos roles de firmware sobre la MISMA base de código, diferenciados por
; build_flags:
;   - nodo_emisor   : lee sensores, empaqueta TelemetryPayload, transmite
;                     por LoRa P2P. Sin SD, sin stack LoRaWAN.
;   - nodo_receptor : escucha LoRa P2P, respalda en MicroSD, actúa de
;                     puente LoRaWAN hacia TTN.
;
; El código en main.cpp/lora_manager.cpp usa #if defined(NODE_ROLE_EMISOR)
; / #if defined(NODE_ROLE_RECEPTOR) para compilar solo la lógica que
; corresponde a cada rol, evitando mantener dos repositorios separados.
;
; Para compilar: pio run -e nodo_emisor   |   pio run -e nodo_receptor
; =============================================================================

[platformio]
default_envs = nodo_emisor

; -----------------------------------------------------------------------------
; Configuración BASE común a ambos roles
; -----------------------------------------------------------------------------
[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

upload_speed = 921600
monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; Necesario en XIAO ESP32-S3 para monitor
                                    ; serial por el puerto USB nativo.

; Librerías comunes: sensores I2C (usados en Emisor) + RadioLib (usado en
; ambos roles: P2P crudo en Emisor, P2P + stack LoRaWAN en Receptor).
lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit MLX90614 Library @ ^2.1.5
    jgromes/RadioLib @ ^6.6.0      ; Soporta SX1262 (P2P) y LoRaWAN (OTAA/TTN)
    milesburton/DallasTemperature @ ^3.9.0
    paulstoffregen/OneWire @ ^2.3.8

monitor_filters = esp32_exception_decoder, time

; -----------------------------------------------------------------------------
; Rol: NODO EMISOR (campo)
; -----------------------------------------------------------------------------
[env:nodo_emisor]
; TEMPORAL: bajado de 921600 a 115200 -- el USB nativo del XIAO ESP32-S3
; estaba dando PermissionError(13) en Windows durante el handshake de
; esptool a 921600 (re-enumeracion del puerto por DTR/RTS mas rapida de lo
; que Windows podia seguir). Si sube estable a 115200 varias veces
; seguidas, probar subir gradualmente: 460800 y despues 921600 de nuevo.
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -D NODE_ROLE_EMISOR

; -----------------------------------------------------------------------------
; Rol: NODO RECEPTOR (gateway local)
; -----------------------------------------------------------------------------
[env:nodo_receptor]
build_flags =
    ${env.build_flags}
    -D NODE_ROLE_RECEPTOR

; El Receptor suma la librería de tarjeta MicroSD sobre SPI (no la necesita
; el Emisor, que no tiene SD física).
lib_deps =
    ${env.lib_deps}
    greiman/SdFat @ ^2.2.3